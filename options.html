<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FormSloth profile</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    p.note { color: #666; font-size: 13px; }
    label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
    textarea { min-height: 90px; }
    button { margin-top: 20px; padding: 10px 18px; font: inherit; border: 0; border-radius: 6px; background: #4a6b3a; color: #fff; cursor: pointer; }
    #status { margin-left: 12px; font-size: 13px; color: #4a6b3a; }
  </style>
</head>
<body>
  <h1>Your FormSloth profile</h1>
  <p class="note">Write each answer once. Everything is stored in this browser only. Leave a field empty to skip it. Never put passwords, card numbers or ID numbers here.</p>
  <div id="fields"></div>
  <button id="save">Save</button><span id="status"></span>
  <script src="bank.js"></script>
  <script src="options.js"></script>
</body>
</html>
